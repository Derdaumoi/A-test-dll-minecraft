name: Build BedrockGraphicsBridge 26.52

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify DLL
        shell: pwsh
        run: |
          $dll = "build/Release/BedrockGraphicsBridge.dll"

          if (!(Test-Path $dll)) {
            Write-Error "BedrockGraphicsBridge.dll was not created"
            exit 1
          }

          Get-Item $dll | Format-List Name,Length,FullName

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: BedrockGraphicsBridge-26.52-x64
          path: build/Release/BedrockGraphicsBridge.dll
